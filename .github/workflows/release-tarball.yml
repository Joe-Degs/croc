name: Release Tarball

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update, for example v0.1.0.'
        required: true
        type: string
      ref:
        description: 'Ref to build. Defaults to tag.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-tarball-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${expected}."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Validate package contents
        run: npm run pack:check

      - name: Build release assets
        run: npm run release:assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${RELEASE_TAG#v}"
          assets=(
            release-assets/croc-darwin-arm64.tar.gz
            release-assets/croc-darwin-x64.tar.gz
            release-assets/croc-linux-arm64.tar.gz
            release-assets/croc-linux-x64.tar.gz
          )

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release delete-asset "${RELEASE_TAG}" "croc-${version}.tgz" --yes 2>/dev/null || true
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --title "${RELEASE_TAG}" \
              --notes "Croc ${RELEASE_TAG}"
          fi
