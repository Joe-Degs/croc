name: Release Tarball

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update, for example v0.1.0.'
        required: true
        type: string
      ref:
        description: 'Ref to build. Defaults to tag.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-tarball-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${expected}."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Validate package contents
        run: npm run pack:check

      - name: Pack tarball
        id: pack
        run: |
          filename="$(npm pack --ignore-scripts --json | node -e "let input=''; process.stdin.on('data', c => input += c); process.stdin.on('end', () => console.log(JSON.parse(input)[0].filename));")"
          echo "filename=${filename}" >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${{ steps.pack.outputs.filename }}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${{ steps.pack.outputs.filename }}" \
              --title "${RELEASE_TAG}" \
              --notes "Croc ${RELEASE_TAG}"
          fi
