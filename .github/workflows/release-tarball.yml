name: Build Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update, for example v0.1.0.'
        required: true
        type: string
      source_ref:
        description: 'Source ref to build/publish. Defaults to tag; use only for release recovery.'
        required: false
        type: string

permissions: {}

concurrency:
  group: release-tarball-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SOURCE_REF: ${{ github.event.inputs.source_ref || github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${expected}."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Validate package contents
        run: npm run pack:check

      - name: Build release assets
        run: npm run release:assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${RELEASE_TAG#v}"
          cd release-assets

          gh release delete-asset "${RELEASE_TAG}" "croc-${version}.tgz" --yes 2>/dev/null || true

          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes "Croc ${RELEASE_TAG}" \
            croc-darwin-arm64.tar.gz \
            croc-darwin-x64.tar.gz \
            croc-linux-arm64.tar.gz \
            croc-linux-x64.tar.gz \
            2>/dev/null || \
          gh release upload "${RELEASE_TAG}" \
            croc-darwin-arm64.tar.gz \
            croc-darwin-x64.tar.gz \
            croc-linux-arm64.tar.gz \
            croc-linux-x64.tar.gz \
            --clobber
